name: sish-v2-tunnel

services:
  sish:
    image: antoniomika/sish:v2.23.0
    restart: unless-stopped
    ports:
      - "${SISH_BIND_ADDRESS:-0.0.0.0}:${SISH_HTTP_PORT:-80}:80"
      - "${SISH_BIND_ADDRESS:-0.0.0.0}:${SISH_HTTPS_PORT:-443}:443"
      - "${SISH_BIND_ADDRESS:-0.0.0.0}:${SISH_SSH_PORT:-2222}:2222"
    volumes:
      - ./.runtime/ssl:/ssl
      - ./.runtime/keys:/keys
      - ./.runtime/pubkeys:/pubkeys
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command:
      - --http-address=:80
      - --https-address=:443
      - --ssh-address=:2222
      - --domain=${SISH_DOMAIN:-ourmemories.kr}
      - --redirect-root=false
      - --bind-any-host=true
      - --bind-root-domain=true
      - --bind-random-subdomains=false
      - --force-requested-subdomains=true
      - --http-load-balancer=false
      - --authentication=true
      - --authentication-password=${SSH_PASSWORD:?Set SSH_PASSWORD in v2_tunnel/.env}
      - --authentication-keys-directory=/pubkeys
      - --private-keys-directory=/keys
      - --https=true
      - --force-all-https=true
      - --https-port-override=${SISH_HTTPS_PORT:-443}
      - --https-certificate-directory=/ssl
      - --https-ondemand-certificate=true
      - --https-ondemand-certificate-accept-terms=true
      - --https-ondemand-certificate-email=${SISH_CERTIFICATE_EMAIL:-}
      - --idle-connection=false

